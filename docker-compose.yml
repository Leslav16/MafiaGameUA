# Starts everything for version 1 on one computer:
#   web          the site            http://localhost:3000
#   game-server  game state          http://localhost:4000/health
#   livekit      camera & mic video  ws://localhost:7880
#   gateway      all three behind one address  http://localhost:8080
#                (start-online.bat gives this address an internet link for friends)
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - game-server
    restart: unless-stopped

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    environment:
      PORT: "4000"
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?Copy .env.example to .env first}
      # LiveKit on this computer by default. For LiveKit Cloud, set both in .env (see .env.example).
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
    ports:
      - "4000:4000"
    depends_on:
      - livekit
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?Copy .env.example to .env first}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  gateway:
    image: caddy:2.10-alpine
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on:
      - web
      - game-server
      - livekit
    restart: unless-stopped
